<!doctype html>
<!-- Прев'ю сторінки /zbir/ (1200×630). Знімок робить tools/build_og.js → img/og-zbir.png. Статичне. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Manrope, system-ui, sans-serif; color: #22261f; position: relative;
    background: radial-gradient(700px 500px at 100% 0%, #e7f0d6 0%, transparent 70%), radial-gradient(600px 500px at 0% 100%, #fde6cf 0%, transparent 70%), #faf6ee; }
  .txt { position: absolute; left: 64px; top: 64px; width: 640px; }
  .eyebrow { display: inline-block; font-weight: 800; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; color: #ff8a1f; border: 3px solid #ff8a1f; border-radius: 99px; padding: 8px 22px; }
  h1 { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 62px; line-height: 1.06; margin-top: 30px; color: #2f6a1c; letter-spacing: -.02em; }
  h1 span { color: #ff8a1f; }
  p { margin-top: 28px; font-size: 27px; font-weight: 700; color: #6b5440; line-height: 1.35; }
  .url { position: absolute; left: 64px; bottom: 52px; font-weight: 800; font-size: 26px; color: #2f6a1c; }
  .art { position: absolute; right: 70px; top: 120px; width: 380px; height: 390px; }
</style>
</head>
<body>
  <div class="txt">
    <span class="eyebrow">Збір співвласників</span>
    <h1>Резервне живлення <span>для нашого будинку</span></h1>
    <p>Вода й опалення без перебоїв, коли зникає світло. Запишіться, скільки готові внести.</p>
  </div>
  <svg class="art" viewBox="0 0 380 390" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cb342"/><stop offset="1" stop-color="#4e8f27"/></linearGradient></defs>
    <rect x="70" y="40" width="240" height="330" rx="38" fill="#fff" stroke="#2f6a1c" stroke-width="14"/>
    <rect x="145" y="12" width="90" height="36" rx="12" fill="#2f6a1c"/>
    <rect x="96" y="176" width="188" height="168" rx="20" fill="url(#g)"/>
    <rect x="96" y="70" width="188" height="92" rx="20" fill="#eef5e4"/>
    <path d="M205 90 L160 160 h32 l-14 62 l60 -88 h-34 z" fill="#ffbf4d" stroke="#e8962a" stroke-width="5" stroke-linejoin="round" transform="translate(0,40)"/>
  </svg>
  <div class="url">po2.kyiv.ua/zbir</div>
</body>
</html>
