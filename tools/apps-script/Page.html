<!doctype html>
<html lang="uk">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#faf6ee; --card:#fff; --text:#22261f; --muted:#6b6a5e; --line:#ece5d6; --green:#4e8f27; --green-d:#2f6a1c; --green-bg:#eef5e4; --red:#c62828; --red-bg:#fdeceb; --amber:#8a5a00; --amber-bg:#fff4d6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 4px 0 2px; color: var(--green-d); }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .stat { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stat b { font-size: 2rem; color: var(--green-d); }
  .stat span { color: var(--muted); font-size: .9rem; }
  .bar { height: 10px; background: var(--green-bg); border-radius: 6px; margin-top: 8px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 6px; transition: width .6s; }
  .bar u { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #e8590c; }
  .drop { display: block; border: 2px dashed #cfd8c3; border-radius: 14px; padding: 22px; text-align: center; cursor: pointer; color: var(--muted); }
  .drop b { display: block; color: var(--green-d); font-size: 1.05rem; margin-bottom: 4px; }
  .drop input { display: none; }
  .drop.over { border-color: var(--green); background: var(--green-bg); color: var(--green-d); }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .thumbs div { position: relative; }
  .thumbs img, .thumbs .pdf { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .8rem; background: #f3f1ea; }
  .thumbs button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #333; color: #fff; font-size: 12px; cursor: pointer; }
  .btn { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 14px; font: 700 1rem system-ui, sans-serif; cursor: pointer; margin-top: 12px; }
  .btn--go { background: var(--green); color: #fff; }
  .btn--ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  label.f { display: block; margin-top: 10px; font-size: .82rem; color: var(--muted); }
  label.f input, label.f select { display: block; width: 100%; margin-top: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: 1rem system-ui, sans-serif; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .warn { list-style: none; padding: 0; margin: 0 0 4px; display: grid; gap: 6px; }
  .warn li { background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
  .warn li.bad { background: var(--red-bg); color: var(--red); font-weight: 700; }
  .now { font-size: .88rem; color: var(--muted); background: #f6f4ee; border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
  .msg { border-radius: 12px; padding: 12px 14px; font-weight: 600; }
  .msg--ok { background: var(--green-bg); color: var(--green-d); }
  .msg--err { background: var(--red-bg); color: var(--red); }
  .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid #cfe1bf; border-top-color: var(--green); border-radius: 50%; animation: s 1s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f1ede2; border-radius: 14px; padding: 4px; margin-bottom: 12px; }
  .tabs button { border: 0; border-radius: 10px; padding: 10px 6px; font: 700 .95rem system-ui, sans-serif; background: transparent; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: #fff; color: var(--green-d); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .verdict { border-radius: 12px; padding: 10px 12px; font-weight: 700; margin-bottom: 8px; }
  .verdict--ok { background: var(--green-bg); color: var(--green-d); }
  .verdict--warn { background: var(--amber-bg); color: var(--amber); }
  .verdict--bad { background: var(--red-bg); color: var(--red); }
  textarea { display: block; width: 100%; margin-top: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: .95rem/1.45 system-ui, sans-serif; resize: vertical; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Підтвердження власників</h1>
  <p class="sub">ЖК «Паркові Озера 2» · голос = власник у ДАХ + право власності</p>

  <div class="card">
    <div class="stat"><b id="pct">…</b><span id="pctSub"></span></div>
    <div class="bar"><i id="barFill" style="width:0"></i><u></u></div>
  </div>

  <div class="card" id="step1">
    <div class="tabs"><button class="on" data-mode="docs">📄 Документи</button><button data-mode="dah">📱 Заявка з ДАХ</button></div>
    <label class="drop">
      <b id="dropTitle">📷 Додати фото документів</b>
      <span id="dropHint">витяг, ДКП, договір з УК — можна кілька фото одного власника</span>
      <small style="display:block;margin-top:6px;opacity:.8">натисни, перетягни файли сюди або встав скрін (Cmd+V)</small>
      <input type="file" id="files" accept="image/*,application/pdf" multiple>
    </label>
    <div class="thumbs" id="thumbs"></div>
    <button class="btn btn--go" id="go" disabled>Розпізнати</button>
  </div>

  <div class="card" id="busy" hidden><span class="spin"></span><span id="busyText">Розпізнаю документи… ~20 с</span></div>
  <div class="msg msg--err" id="err" hidden></div>
  <div class="msg msg--ok" id="ok" hidden></div>

  <div class="card" id="step2" hidden>
    <ul class="warn" id="warn"></ul>
    <div class="row">
      <label class="f">Тип<select id="type"><option>квартира</option><option>нежитлове</option><option>паркомісце</option><option>невідомо</option></select></label>
      <label class="f">№<input id="number" inputmode="text"></label>
    </div>
    <div class="row">
      <label class="f">Площа, м²<input id="area" inputmode="decimal"></label>
      <label class="f">Право<select id="right"><option>право власності</option><option>інвестиційний договір</option><option>інше</option><option>невідомо</option></select></label>
    </div>
    <label class="f">ПІБ власника<input id="owner"></label>
    <div class="row">
      <label class="f">Телефон (необов'язково)<input id="phone" inputmode="tel"></label>
      <label class="f">Дата реєстрації<input id="date"></label>
    </div>
    <label class="f">Документи<input id="docs" readonly></label>
    <div class="now" id="now"></div>
    <button class="btn btn--go" id="approve">✅ Підтвердити і внести</button>
    <button class="btn btn--ghost" id="cancel">Скасувати</button>
  </div>

  <div class="card" id="step2dah" hidden>
    <div class="verdict" id="dVerdict"></div>
    <ul class="warn" id="dWarn"></ul>
    <div class="row">
      <label class="f">№ квартири<input id="dNumber" inputmode="numeric"></label>
      <label class="f">Статус у ДАХ<select id="dRole"><option>власник</option><option>користувач</option><option>орендар</option><option>невідомо</option></select></label>
    </div>
    <label class="f">Ім'я в ДАХ<input id="dName"></label>
    <div class="now" id="dNow"></div>
    <label class="f">ПІБ для реєстру (повністю)<input id="dOwner"></label>
    <div class="row">
      <label class="f">Площа, м²<input id="dArea" inputmode="decimal"></label>
      <label class="f">Телефон<input id="dPhone" inputmode="tel"></label>
    </div>
    <label class="f">Повідомлення заявнику в ДАХ<textarea id="dMsg" rows="6"></textarea></label>
    <button class="btn btn--ghost" id="dCopy">📋 Скопіювати повідомлення</button>
    <button class="btn btn--go" id="dApprove">✅ Внести: право власності + у ДАХ</button>
    <button class="btn btn--ghost" id="dCancel">Скасувати</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let images = [], result = null, lastPct = null, mode = 'docs', dres = null;
  const dahPhones = {}; // телефон із заявки ДАХ → підставимо, коли прийдуть документи на ту саму квартиру
  const esc = (w) => String(w).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const warnHtml = (list) => list.map((w) => `<li class="${w.startsWith('❗') ? 'bad' : ''}">${esc(w)}</li>`).join('');

  // ---- режим: документи / заявка з ДАХ
  document.querySelector('.tabs').onclick = (e) => {
    const m = e.target.dataset.mode; if (!m || m === mode) return;
    mode = m; document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
    $('dropTitle').textContent = m === 'dah' ? '📱 Додати скрін заявки з ДАХ' : '📷 Додати фото документів';
    $('dropHint').textContent = m === 'dah' ? 'картка заявника: ім\'я, № квартири, статус, телефон (можна 2–3 скріни)' : 'витяг, ДКП, договір з УК — можна кілька фото одного власника';
    $('step2').hidden = $('step2dah').hidden = $('err').hidden = $('ok').hidden = true;
    images = []; drawThumbs();
  };

  const fmtPct = (s) => (s.dahArea / s.baseArea * 100).toFixed(1).replace('.', ',') + '%';
  const showStats = (s) => {
    const pct = s.dahArea / s.baseArea * 100, votes = s.sections.reduce((n, x) => n + x.inDah, 0);
    $('pct').textContent = fmtPct(s);
    $('pctSub').textContent = `голосів · ${votes} кв. + ${s.nonres} нежитл. · ${s.dahArea.toLocaleString('uk-UA')} м² з ${s.baseArea.toLocaleString('uk-UA')}`;
    $('barFill').style.width = Math.min(100, pct) + '%';
    return pct;
  };
  const err = (e) => { $('busy').hidden = true; $('err').hidden = false; $('err').textContent = '⚠ ' + (e && e.message || e); };
  const call = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));

  call('summary').then((s) => { lastPct = showStats(s); }).catch(err);

  // ---- фото: стискаємо в браузері (≤2000 px, JPEG) — швидше і працює з HEIC на iPhone
  const shrink = (file) => new Promise((res, rej) => {
    if (file.type === 'application/pdf') {
      const fr = new FileReader();
      fr.onload = () => res({ type: 'application/pdf', data: fr.result.split(',')[1], name: file.name });
      fr.onerror = rej; fr.readAsDataURL(file); return;
    }
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({ type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1], preview: c.toDataURL('image/jpeg', 0.5) });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error('Не вдалося відкрити фото ' + file.name));
    img.src = URL.createObjectURL(file);
  });

  const drawThumbs = () => {
    $('thumbs').innerHTML = images.map((im, i) => `<div>${im.preview ? `<img src="${im.preview}">` : '<span class="pdf">PDF</span>'}<button data-i="${i}">✕</button></div>`).join('');
    $('go').disabled = !images.length;
  };
  $('thumbs').onclick = (e) => { if (e.target.dataset.i) { images.splice(+e.target.dataset.i, 1); drawThumbs(); } };
  const addFiles = async (files) => {
    files = [...files].filter((f) => /^image\/|pdf$/.test(f.type));
    if (!files.length) return;
    $('err').hidden = $('ok').hidden = true;
    try { images = images.concat(await Promise.all(files.map(shrink))).slice(0, 6); drawThumbs(); }
    catch (x) { err(x); }
  };
  $('files').onchange = async (e) => { await addFiles(e.target.files); e.target.value = ''; };
  // перетягування файлів у зону (і будь-куди на сторінку) та вставка скріна з буфера (Cmd/Ctrl+V)
  const drop = document.querySelector('.drop');
  ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
  document.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
  document.addEventListener('paste', (e) => { if (e.target.closest('input, textarea')) return; addFiles([...e.clipboardData.items].map((i) => i.getAsFile()).filter(Boolean)); });

  // ---- розпізнавання
  $('go').onclick = () => {
    if (mode === 'dah') return goDah();
    $('err').hidden = $('ok').hidden = true; $('busy').hidden = false; $('go').disabled = true;
    $('busyText').textContent = 'Розпізнаю документи… ~20 с';
    call('analyze', images.map(({ type, data }) => ({ type, data }))).then((d) => {
      result = d; $('busy').hidden = true; $('step2').hidden = false; $('go').disabled = false;
      $('type').value = d.object_type; $('number').value = d.number; $('area').value = d.area_total;
      $('owner').value = d.owners.map((o) => o.name + (o.share && o.share !== '1/1' ? ' (' + o.share + ')' : '')).join('; ');
      $('right').value = d.right_type; $('date').value = d.registration_date; $('docs').value = d.documents.join(', ');
      $('phone').value = d.phone || dahPhones[d.number] || (d.current && d.current.phone) || '';
      $('warn').innerHTML = warnHtml(d.warnings);
      const c = d.current;
      $('now').textContent = c ? `Зараз у реєстрі: ${c.status || '—'} · ${c.area ? c.area + ' м²' : 'без площі'} · ${c.owner || 'без ПІБ'} · ${c.dah || ''}` : 'У реєстрі не знайдено';
      checkApprove();
      $('step2').scrollIntoView({ behavior: 'smooth' });
    }).catch((x) => { err(x); $('go').disabled = false; });
  };

  const checkApprove = () => {
    const ok = $('right').value === 'право власності' && $('number').value.trim() && ['квартира', 'нежитлове'].includes($('type').value);
    $('approve').disabled = !ok;
    $('approve').textContent = ok ? '✅ Підтвердити і внести' : 'Не можна внести: потрібне право власності й № квартири/нежитлового';
  };
  ['right', 'number', 'type'].forEach((id) => $(id).addEventListener('input', checkApprove));

  // ---- підтвердження
  $('approve').onclick = () => {
    $('approve').disabled = true; $('busy').hidden = false; $('busyText').textContent = 'Вношу в реєстр…';
    call('approve', {
      type: $('type').value, number: $('number').value.trim(), area: $('area').value.trim(), owner: $('owner').value.trim(),
      phone: $('phone').value.trim(), right: $('right').value, date: $('date').value, documents: result.documents,
      warnings: result.warnings, images: images.map(({ type, data }) => ({ type, data })),
    }).then((s) => {
      const before = lastPct; lastPct = showStats(s);
      $('busy').hidden = true; $('step2').hidden = true; images = []; drawThumbs();
      $('ok').hidden = false;
      $('ok').textContent = `Внесено ✅ № ${$('number').value}. Тепер ${fmtPct(s)}` + (before != null ? ` (${lastPct - before >= 0 ? '+' : ''}${(lastPct - before).toFixed(2).replace('.', ',')}%)` : '') + '. Сайт оновиться протягом 5 хв.';
    }).catch((x) => { err(x); checkApprove(); });
  };
  $('cancel').onclick = () => { $('step2').hidden = true; result = null; };

  // ---- заявка з ДАХ
  const VERDICT = {
    ok: ['verdict--ok', '✅ Власник збігається з реєстром — можна вносити'],
    confirm: ['verdict--warn', '🟡 ПІБ збігається, але право власності в реєстрі не підтверджене документом'],
    proof: ['verdict--warn', '🟡 Не збігається з реєстром — попроси документ (повідомлення нижче)'],
    'not-owner': ['verdict--bad', '⛔ Не власник — голос не рахується. Надішли повідомлення нижче'],
  };
  const showDah = (d) => {
    dres = d;
    const [cls, txt] = VERDICT[d.verdict] || VERDICT.proof;
    $('dVerdict').className = 'verdict ' + cls; $('dVerdict').textContent = txt;
    $('dWarn').innerHTML = warnHtml(d.warnings);
    const c = d.current;
    $('dNow').textContent = c ? `У реєстрі: ${c.owner || 'без ПІБ'} · ${c.status || '—'} · ${c.area ? c.area + ' м²' : 'без площі'} · ${c.dah || ''}` : 'У реєстрі не знайдено';
    $('dMsg').value = d.message || '';
    const owner = d.role === 'власник';
    $('dApprove').disabled = !owner || !c;
    $('dApprove').textContent = !owner ? 'Не власник — не вношу' : !c ? 'Квартири немає в реєстрі' : '✅ Внести: право власності + у ДАХ';
    // не підтверджено реєстром — головна дія «надіслати повідомлення», внесення стає другорядним
    $('dApprove').className = 'btn ' + (d.verdict === 'ok' ? 'btn--go' : 'btn--ghost');
    $('dCopy').className = 'btn ' + (d.verdict === 'ok' ? 'btn--ghost' : 'btn--go');
    if (owner && c && d.verdict !== 'ok') $('dApprove').textContent = 'Все одно внести (я перевірив документи)';
  };
  const goDah = () => {
    $('err').hidden = $('ok').hidden = true; $('busy').hidden = false; $('go').disabled = true;
    $('busyText').textContent = 'Розпізнаю скрін… ~15 с';
    call('analyzeDah', images.map(({ type, data }) => ({ type, data }))).then((d) => {
      $('busy').hidden = true; $('go').disabled = false; $('step2dah').hidden = false;
      if (d.number && d.phone) dahPhones[d.number] = d.phone;
      $('dNumber').value = d.number; $('dRole').value = d.role; $('dName').value = d.name;
      const c = d.current;
      // ПІБ і площа: з реєстру, якщо власник збігається (там повний ПІБ); інакше — як у ДАХ
      $('dOwner').value = c && c.owner && d.match === 'так' ? c.owner : d.name;
      $('dArea').value = (c && c.area) || '';
      $('dPhone').value = d.phone || (c && c.phone) || '';
      showDah(d);
      $('step2dah').scrollIntoView({ behavior: 'smooth' });
    }).catch((x) => { err(x); $('go').disabled = false; });
  };
  // виправив № / статус / ім'я — перевіряємо ще раз
  ['dNumber', 'dRole', 'dName'].forEach((id) => $(id).addEventListener('change', () => {
    const d = { number: $('dNumber').value.trim(), role: $('dRole').value, name: $('dName').value.trim(), entrance: (dres && dres.entrance) || '' };
    call('dahCheck', d).then((x) => {
      showDah(Object.assign(d, x));
      if (x.current) { $('dArea').value = $('dArea').value || x.current.area || ''; if (x.match === 'так' && x.current.owner) $('dOwner').value = x.current.owner; }
    }).catch(err);
  }));
  $('dCopy').onclick = () => {
    const t = $('dMsg'); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(() => document.execCommand('copy'));
    $('dCopy').textContent = '✓ Скопійовано'; setTimeout(() => ($('dCopy').textContent = '📋 Скопіювати повідомлення'), 1500);
  };
  $('dApprove').onclick = () => {
    if (dres.verdict !== 'ok' && !confirm('Власник не підтверджений реєстром однозначно. Все одно внести «Право власності» + «У ДАХ»?')) return;
    $('dApprove').disabled = true; $('busy').hidden = false; $('busyText').textContent = 'Вношу в реєстр…';
    const num = $('dNumber').value.trim();
    call('approve', {
      type: 'квартира', number: num, area: $('dArea').value.trim(), owner: $('dOwner').value.trim(), phone: $('dPhone').value.trim(),
      right: 'право власності', date: '', documents: ['заявка ДАХ (' + $('dRole').value + ', збіг ПІБ: ' + dres.match + ')'],
      warnings: dres.warnings, images: images.map(({ type, data }) => ({ type, data })),
    }).then((s) => {
      const before = lastPct; lastPct = showStats(s);
      $('busy').hidden = true; $('step2dah').hidden = true; images = []; drawThumbs();
      $('ok').hidden = false;
      $('ok').textContent = `Внесено ✅ кв. ${num}. Тепер ${fmtPct(s)}` + (before != null ? ` (${lastPct - before >= 0 ? '+' : ''}${(lastPct - before).toFixed(2).replace('.', ',')}%)` : '') + '. Сайт оновиться протягом 5 хв.';
    }).catch((x) => { err(x); $('dApprove').disabled = false; });
  };
  $('dCancel').onclick = () => { $('step2dah').hidden = true; dres = null; };
</script>
