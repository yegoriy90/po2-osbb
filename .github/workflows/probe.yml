# ТИМЧАСОВИЙ: аватарки закладів з Instagram (og:image). Видалити після.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in skyfall.beauty.studio lafam_kyiv nenamazana_; do
            echo "### $n"
            H=$(curl -sS -L -m 30 -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "https://www.instagram.com/$n/")
            U=$(printf '%s' "$H" | grep -oE '<meta[^>]*og:image[^>]*>' | head -1 | grep -oE 'content="[^"]*"' | sed 's/content="//; s/"$//; s/&amp;/\&/g')
            [ -n "$U" ] || U=$(printf '%s' "$H" | grep -oE '"profile_pic_url(_hd)?":"[^"]*"' | head -1 | sed 's/.*":"//; s/"$//; s#\\/#/#g; s/\\u0026/\&/g')
            printf '%s' "$H" | grep -oE 'og:[a-z]+' | sort | uniq -c | head
            echo "og: ${U:0:120}"
            [ -n "$U" ] || continue
            curl -sS -L -m 30 -o a.jpg "$U" && convert a.jpg -resize 320x320^ -gravity center -extent 320x320 -quality 82 b.jpg && echo "B64START" && base64 -w0 b.jpg && echo && echo "B64END"
          done
