# ТИМЧАСОВИЙ: формат API світлобота light.rmn.pp.ua. Видалити після.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://light.rmn.pp.ua
          for p in llms.txt api/openapi.json "api/power-status" "api/schedule/home" "api/events?limit=6" "api/history?days=3"; do
            echo "################ /$p"
            curl -sS -m 20 -D /tmp/h -o /tmp/b -H "Origin: https://po2.kyiv.ua" "$B/$p" -w "HTTP %{http_code} %{content_type}\n" || true
            grep -iE "access-control|cache-control" /tmp/h || true
            head -c 12000 /tmp/b; echo
          done
