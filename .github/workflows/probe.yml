# ТИМЧАСОВИЙ: перевірка веб-застосунку «Поруч». Видалити після.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L -m 30 -H "Origin: https://po2.kyiv.ua" -D - "https://script.google.com/macros/s/AKfycbzQhALitDX_kt7c8xNa1hMI3ZV6R9v31uJWegc6T4-Rdu-ktzTMhgUnqksLmdjQvNyceA/exec?places=1" | grep -iE "^HTTP|access-control|content-type|^\{"; echo
          curl -sS -L -m 30 "https://script.google.com/macros/s/AKfycbzQhALitDX_kt7c8xNa1hMI3ZV6R9v31uJWegc6T4-Rdu-ktzTMhgUnqksLmdjQvNyceA/exec" | head -c 300; echo
