# ТИМЧАСОВИЙ: перевірка API світла. Видалити після.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://light.rmn.pp.ua/api
          curl -sS -m 30 -w '\nsize=%{size_download} time=%{time_total}\n' "$A/schedule-history/home?limit=200" -o h.json; ls -la h.json
          jq -r '.[] | (.schedule_text | fromjson) as $s | "\(.timestamp) | today \($s.today.date[0:10]) \($s.today.status) def=\([$s.today.slots[]? | select(.type=="Definite") | "\(.start)-\(.end)"] | join(",")) | tmr \($s.tomorrow.status) def=\([$s.tomorrow.slots[]? | select(.type=="Definite") | "\(.start)-\(.end)"] | join(","))"' h.json | uniq -f6 | head -60
          jq length h.json
